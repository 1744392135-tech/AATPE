# AATPE Battery Profile
# v85: CONTROL_MODE removed — profile must not override user control mode
DECISION_INTERVAL=500
CONFIDENCE_THRESHOLD=10
MIGRATION_COST_THRESHOLD=5
MAX_MIGRATIONS_PER_SEC=40
MAX_MIGRATIONS_PER_CYCLE=10
THERMAL_ENABLED=1
THERMAL_LIMIT_CPU=120
THERMAL_LIMIT_SKIN=120
THERMAL_LIMIT_BATTERY=120
# 温控墙三档（WARNING < CRITICAL < EMERGENCY，单位°C，本profile完整定义）
# battery 偏保守：更早触发 WARNING/CRITICAL，但EMERGENCY 由全局 aatpe.conf 决定（当前 120°C），profile 不能覆盖
THERMAL_WARNING_THRESHOLD=75
THERMAL_CRITICAL_THRESHOLD=85
FRAME_AWARE=1
TARGET_FRAME_TIME=16667
FRAME_CRITICAL_THRESHOLD=12000
JANK_THRESHOLD_PERCENT=3.0
LAYER_CRITICAL_THRESHOLD=150
LEARNING_ENABLED=1
HISTORY_WEIGHT=30
LEARNING_DECAY=95
HISTORY_MIN_SAMPLES=5
ML_LEARNING_ENABLED=1
ML_MAX_ALPHA=0.2
ML_INITIAL_LR=0.01
ML_DECAY=0.999
ML_SAVE_INTERVAL=60
ML_WEIGHT_CLAMP=10.0
ML_HYBRID_ENABLED=0
THREAD_SCAN_INTERVAL=10
MAX_TRACKED_THREADS=256
IGNORE_SYSTEM_THREADS=1
WATCHDOG_ENABLED=1
WATCHDOG_INTERVAL=5
SAFETY_MIGRATION_LIMIT=120
SAFETY_LATENCY_LIMIT=20000
SAFETY_LOAD_LIMIT=95
CPU_USAGE_LIMIT=75
DAEMON_MEMORY_WARN_KB=65536
LOG_LEVEL=1
LOG_DECISIONS=0
LOG_THERMAL=1
LOG_FRAME=0
AUTO_PROFILE=1
GAME_DETECTION=1
BATTERY_SAVER_THRESHOLD=20
# 旧键：0 = 禁用，由上面的 THERMAL_WARNING/CRITICAL/EMERGENCY 三档接管
THERMAL_PROFILE_THRESHOLD=0
REFRESH_RATE_MODE=current
# LITTLE_POOL= (留空=自动检测 via cpu_capacity)
# MID_POOL= (留空=自动检测 via cpu_capacity)
# BIG_POOL= (留空=自动检测 via cpu_capacity)
# EMERGENCY_THRESHOLD is a global safety limit (aatpe.conf), profiles cannot override it.
