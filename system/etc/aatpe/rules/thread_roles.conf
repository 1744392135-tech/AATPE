# AATPE 线程角色规则
# 格式: 进程名:线程名:角色:子类型:优先级(0-99)
# 进程名和线程名可用 * 通配
# 角色: S0=系统关键 S1=UI主线程 S2=渲染线程 S3=游戏线程 S4=高吞吐 S5=后台

# ===== S0: 系统关键线程 (DO_NOT_TOUCH) =====
surfaceflinger:*:S0:SYSTEM:99
system_server:android.anim*:S0:SYSTEM:99
system_server:android.ui*:S0:SYSTEM:99
system_server:ActivityManager*:S0:SYSTEM:99
system_server:WindowManager*:S0:SYSTEM:99
system_server:InputDispatcher*:S0:SYSTEM:99
system_server:InputReader*:S0:SYSTEM:99
system_server:PowerManager*:S0:SYSTEM:99
system_server:AlarmManager*:S0:SYSTEM:99
audioserver:*:S0:AUDIO:99
cameraserver:*:S0:CAMERA:99
*:Binder_*:S0:BINDER:95
*:binder*:S0:BINDER:95
init:*:S0:SYSTEM:99
zygote:*:S0:SYSTEM:99
*:watchdog*:S0:SYSTEM:99
*:ksud:S0:SYSTEM:99
*:magiskd:S0:SYSTEM:99
# v94: kworker 由 isKernelThread()(placement.cpp "kworker/" 前缀)在扫描/放置/迁移三处排除,
# 此规则仅作兜底标记, 优先级从99降到30, 避免误把内核worker当S0关键线程干预.
*:kworker*:S0:SYSTEM:30
*:migration*:S0:SYSTEM:99
*:rcu_*:S0:SYSTEM:99

# ===== S1: UI / 主线程 (高延迟敏感) =====
*:main:S1:UI_MAIN:90
