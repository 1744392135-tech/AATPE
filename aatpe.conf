# =============================================================================
# AATPE 配置文件（/system/etc/aatpe/aatpe.conf）
# 改完保存即可，守护进程会自动热重载（不用重启手机）。
# 数值单位见每项注释；取值越界时守护进程会自动夹到合法范围并记日志。
# 不理解的项保持默认即可——默认值就是真机长期调优后的安全值。
# =============================================================================

# ---------------- 控制模式 ----------------
# off    = 完全接管（激进模式，自动帮你调所有调度）
# assist = 辅助模式（默认。只在卡顿/发热时出手，日常不动）
# passive= 只观察不动手（WebUI 能看数据，但不调任何调度）
CONTROL_MODE=assist

# ---------------- 决策节奏 ----------------
# 主循环每多少毫秒做一轮调度决策。10~5000，默认 200ms（每秒 5 次）。
# 调小更跟手但更耗电，调大更省电但反应慢。
DECISION_INTERVAL=200

# 两个连续决策之间的最短间隔（毫秒），防止一帧内疯狂重排。默认 33ms（约 30 次/秒上限）。
DECISION_MIN_INTERVAL_MS=33

# 前台没游戏、设备空闲时，主循环放慢到这个间隔（毫秒），省电。默认 200ms。
DECISION_IDLE_INTERVAL_MS=200

# ---------------- 任务迁移（把线程搬大核/小核） ----------------
# 一个线程在新核上"站稳"多少秒后才允许再搬走，防止反复横跳。默认 5 秒。
MIGRATION_DWELL_SEC=5

# 调度决策置信度门槛（1~10）。低于这个分数不搬动。默认 5，调高更保守、调低更激进。
CONFIDENCE_THRESHOLD=5

# 迁移成本门槛：只有"搬过去的收益"大于这个值才搬。默认 3，防止为了微小收益频繁搬线程。
MIGRATION_COST_THRESHOLD=3

# 每秒最多搬多少次线程（硬上限，防爆）。默认 80。
MAX_MIGRATIONS_PER_SEC=80

# 每轮决策最多搬多少个线程。默认 20。
MAX_MIGRATIONS_PER_CYCLE=20

# ---------------- 温控 ----------------
# 是否启用温控总开关。1=开（推荐），0=关。
THERMAL_ENABLED=1

# CPU 温度上限（千分之一摄氏度，即 120 = 12.0°C 只是阈值标签，
# 真实温度读数来自内核 hwmon，超过此值开始降频保护）。默认 120（即 120°C/100 标签）。
THERMAL_LIMIT_CPU=120
# 皮肤温度上限，同上。
THERMAL_LIMIT_SKIN=120
# 电池温度上限。
THERMAL_LIMIT_BATTERY=120

# ---------------- 优先级提升 / 智能放置 ----------------
# 是否给前台游戏线程临时提优先级（boost）。1=开。
PRIORITY_BOOST_ENABLED=1
# 提升幅度 0~3（0 不动 / 1 轻度 / 2 中度 / 3 重度）。默认 1。
PRIORITY_BOOST_LEVEL=1
# 是否启用智能放置（自动把游戏线程放大核、后台小核）。1=开（推荐）。
SMART_PLACEMENT_ENABLED=1

# 放置打分时三个因子的权重（加起来≈1.0）：
#   核心亲和性（历史上这个线程习惯跑哪个核）
CORE_AFFINITY_WEIGHT=0.3
#   负载均衡（哪个核当前空闲）
LOAD_BALANCE_WEIGHT=0.4
#   温度（哪个核更凉）
TEMPERATURE_WEIGHT=0.3

# ---------------- 帧率感知 ----------------
# 是否根据真实帧率决策。1=开（强烈推荐，关了就成盲调了）。
FRAME_AWARE=1
# 目标帧时间（微秒）。16667 = 16.67ms = 60fps；若你要稳 120fps 改 8333。
TARGET_FRAME_TIME=16667
# 帧时间超过这个值（微秒）就判定"掉帧临界"，开始紧急 boost。默认 12000（12ms ≈ 83fps 以下）。
FRAME_CRITICAL_THRESHOLD=12000
# 掉帧比例超过这个百分比算"严重卡顿"，强制干预。默认 3.0%。
JANK_THRESHOLD_PERCENT=3.0
# 渲染层判定临界值（层 buffer 数），用于找出真正前台的游戏层。默认 150。
LAYER_CRITICAL_THRESHOLD=150

# ---------------- 学习 / 机器学习 ----------------
# 是否启用历史学习（记录每个 app 过去的调度效果，越用越准）。1=开。
LEARNING_ENABLED=1
# 历史样本权重（越大越相信历史）。默认 30。
HISTORY_WEIGHT=30
# 历史衰减（95 = 保留 95% 旧经验，每轮乘一次）。默认 95。
LEARNING_DECAY=95
# 至少攒够多少样本才开始参考历史。默认 5。
HISTORY_MIN_SAMPLES=5
# 是否启用 ML 模型总开关。1=开。
ML_ENABLED=1
# 是否让 ML 边跑边学。1=开。
ML_LEARNING_ENABLED=1
# 学习率上限（防止某条样本把模型带飞）。默认 0.3。
ML_MAX_ALPHA=0.3
# 初始学习率。默认 0.01。
ML_INITIAL_LR=0.01
# 学习率衰减系数（每次更新乘这个）。默认 0.999。
ML_DECAY=0.999
# 每隔多少秒把 ML 模型落盘一次。默认 30。
ML_SAVE_INTERVAL=30
# 权重上限钳制（防止极端值）。默认 10.0。
ML_WEIGHT_CLAMP=10.0
# 是否启用混合 ML（多模型投票）。0=关（默认，实验性功能）。
ML_HYBRID_ENABLED=0

# ---------------- 电池 / 冷启动保护 ----------------
# 电池老化保护（充电时限制 boost 强度，减少电池发热）。1=开。
BATTERY_AGING_PROTECTION=1
# ML 冷启动保护：模型样本不够时不许乱动，先用内置规则兜底。1=开。
ML_COLD_START_PROTECTION=1
# 至少攒多少条样本才允许 ML 接管（之前纯规则）。默认 2000。
ML_MIN_SAMPLES=2000

# ---------------- 网络 / WebUI / 联邦学习 / eBPF ----------------
# 是否内置 HTTP 服务器（WebUI 看数据）。1=开。
ENABLE_HTTP_SERVER=1
# 是否启用联邦学习（多机汇总模型，隐私友好）。1=开。
FEDERATED_ENABLED=1
# 是否用"帧时间"作为 ML 的反馈信号。1=开。
ML_FRAME_TIME_OUTCOME=1
# 帧时间反馈在 ML 奖励里的权重。默认 0.5。
ML_FRAME_TIME_WEIGHT=0.5
# 是否启用 eBPF 事件驱动（用内核追踪，比轮询省电又准）。1=开（无权限自动降级）。
EBPF_ENABLED=1
# eBPF ring buffer 页数（2 的幂）。默认 128。
EBPF_RING_PAGES=128
# eBPF 没挂上时是否退回轮询。1=是。
EBPF_POLL_FALLBACK=1

# ---------------- ADRC 自抗扰控制器（调度核心算法参数，一般不用动） ----------------
# 开关。1=开。
ADRC_ENABLED=1
# 采样周期（秒）。默认 0.05 = 50ms。
ADRC_H=0.05
# 速度因子。默认 50。
ADRC_R=50
# 扩张状态观测器三参数（β01/02/03），越大观测越灵但越容易抖。默认 100/300/1000。
ADRC_BETA01=100
ADRC_BETA02=300
ADRC_BETA03=1000
# 误差校正增益 β1/β2。默认 10 / 0.5。
ADRC_BETA1=10
ADRC_BETA2=0.5
# 跟踪快慢 α1/α2。默认 0.75 / 1.25。
ADRC_ALPHA1=0.75
ADRC_ALPHA2=1.25
# 积分步长。默认 0.01。
ADRC_DELTA=0.01
# 控制增益 B0。默认 1.0。
ADRC_B0=1.0
# "紧急"判定阈值（0~1）。默认 0.5。
ADRC_URGENCY_THRESHOLD=0.5
# "高风险"判定阈值，超过就宁可保守。默认 0.6。
ADRC_RISK_THRESHOLD=0.6
# 帧时间调整量上限（占比），防止一刀砍死。默认 0.7。
ADRC_CLAMP_FRAME_RATIO=0.7
# 规则模型权重基底。默认 0.4。
ADRC_WEIGHT_BASE=0.4
# ML 模型权重基底。默认 0.6。
ADRC_ML_WEIGHT_BASE=0.6

# ---------------- 线程扫描 ----------------
# 每隔多少秒扫一遍线程列表。默认 5 秒。
THREAD_SCAN_INTERVAL=5
# 最多跟踪多少个线程（防爆）。默认 512。
MAX_TRACKED_THREADS=512
# 是否忽略系统线程（只盯 app 线程）。1=是（推荐）。
IGNORE_SYSTEM_THREADS=1
# 强制关注的包名白名单（逗号分隔，留空=自动检测游戏）。
PACKAGE_WHITELIST=

# 游戏包名（逗号分隔，前台命中这些包时自动进游戏模式）。
# 默认带的是王者荣耀/原神/和平精英；按你自己玩的改。
GAME_PACKAGES=com.tencent.tmgp.sgame,com.miHoYo.GenshinImpact,com.tencent.tmgp.pubgmhd

# ---------------- 安全 / 看门狗 / CPU 保护 ----------------
# 是否要求控制命令带 HMAC 签名（防止别的 app 乱发指令）。1=开。
HMAC_REQUIRED=1
# 看门狗开关。1=开（守护进程卡死时自动重启它）。
WATCHDOG_ENABLED=1
# 看门狗每隔多少秒检查一次。默认 3。
WATCHDOG_INTERVAL=3
# 每秒迁移硬上限（安全网）。默认 120。
SAFETY_MIGRATION_LIMIT=120
# 主循环单轮耗时上限（微秒），超过就报警。默认 20000。
SAFETY_LATENCY_LIMIT=20000
# 整体负载超过这个百分比就停手。默认 95。
SAFETY_LOAD_LIMIT=95
# CPU 使用率超过这个百分比不再 boost。默认 85。
CPU_USAGE_LIMIT=85

# 守护进程自身内存超过这个 KB 就报警（默认 64MB）。
DAEMON_MEMORY_WARN_KB=65536

# ---------------- 日志 ----------------
# 0=只错误 / 1=警告 / 2=信息 / 3=调试。日常用 2 即可，排查时改 3。
LOG_LEVEL=2
# 是否记录每一次调度决策。1=开。
LOG_DECISIONS=1
# 是否记录温控事件。1=开。
LOG_THERMAL=1
# 是否记录帧率事件。1=开。
LOG_FRAME=1

# ---------------- 自动档位 / 游戏检测 ----------------
# 是否自动按场景切档位（balanced/performance/powersave）。1=开。
AUTO_PROFILE=1
# 当前档位：balanced（均衡）/ performance（性能）/ powersave（省电）。默认 balanced。
CURRENT_PROFILE=balanced
# 是否自动检测前台是游戏。1=开。
GAME_DETECTION=1
# 电量低于这个百分比自动进省电档。默认 20。
BATTERY_SAVER_THRESHOLD=20
# 温度超过这个阈值（°C）自动切温降档。默认 80。
THERMAL_PROFILE_THRESHOLD=80

# ---------------- 温度分级（°C） ----------------
# 80°C 开始告警、90°C 开始紧急降频、120 为上限标签。
THERMAL_WARNING_THRESHOLD=80
THERMAL_CRITICAL_THRESHOLD=90
THERMAL_EMERGENCY_THRESHOLD=120

# ---------------- 刷新率 ----------------
# current=跟随系统 / 60 / 90 / 120 / 144。默认 current。
REFRESH_RATE_MODE=current

# ---------------- 看门狗重启策略 ----------------
# 60 秒窗口内最多自动重启守护进程几次。默认 5 次。
WATCHDOG_MAX_RESTARTS=5
# 重启窗口长度（秒）。默认 60。
WATCHDOG_RESTART_WINDOW=60

# ---------------- uclamp / 输入 boost（一般不用动） ----------------
# 后台任务的 uclamp 效率值（0~100）。默认 25。
UCLAMP_PASSIVE_PCT=25
# 前台游戏临界态的 uclamp 下限/上限。默认 80~100。
UCLAMP_CRITICAL_MIN_PCT=80
UCLAMP_CRITICAL_MAX_PCT=100
# 辅助模式下的 uclamp 下限。默认 70。
UCLAMP_ASSIST_MIN_PCT=70
# SurfaceFlinger 的 uclamp。默认 20。
UCLAMP_SF_PCT=20
# 点按屏幕后的 boost 持续时间（毫秒），按不同刷新率分档。
INPUT_BOOST_MS_60=80
INPUT_BOOST_MS_120=50
INPUT_BOOST_MS_144=40
# 临界时给 schedtune 加多少。默认 60。
SCHEDTUNE_CRITICAL_BOOST=60

# ---------------- 功能总开关（false=默认关的实验性功能，true=开） ----------------
# 预 boost（点按前先预热大核）。
PREBOOST_ENABLED=false
# 温控平滑滤波。
THERMAL_SMOOTH_ENABLED=false
# 场景推断（自动识别游戏/视频/阅读）。
SCENEINFER_ENABLED=false
# C2 信封（远程配置加密下发）。
C2_ENVELOPE_ENABLED=false
# C4 后台冻结（把后台游戏冻住省点，回前台自动解冻）。
C4_FREEZER_ENABLED=true
