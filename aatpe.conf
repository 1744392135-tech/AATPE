# AATPE - 主配置文件
# 控制模式: passive | assist | active
CONTROL_MODE=assist

# 决策间隔 (毫秒, 范围: 50-2000, 默认: 200)
DECISION_INTERVAL=200

# 功耗优化: 决策最小间隔 (毫秒, 范围: 0-1000, 默认: 33)
# 被重要事件唤醒后，距上次决策不足此时长则补sleep，防止事件风暴导致决策过频。
DECISION_MIN_INTERVAL_MS=33

# 功耗优化: 空闲轮询间隔 (毫秒, 范围: 10-5000, 默认: 200)
# 无重要事件时 poll() 的超时时间。值越大越省电，但事件响应延迟越高。
DECISION_IDLE_INTERVAL_MS=200

# 迁移驻留时间 (秒, 范围: 1-60, 默认: 5)
# 同一线程成功迁移后，在此时间内不再迁移。与 MIGRATION_COOLDOWN_MS（决策冷却）是两个概念。
MIGRATION_DWELL_SEC=5

# 置信度阈值 (分数差距低于此值不迁移, 范围: 1-100, fix34: 15→5 适配池级affinity)
CONFIDENCE_THRESHOLD=5

# 迁移成本阈值 (收益必须大于此值才迁移, fix34: 10→3 适配池级affinity)
MIGRATION_COST_THRESHOLD=3

# 最大每秒迁移次数 (防抖, 范围: 1-500, 默认: 80)
MAX_MIGRATIONS_PER_SEC=80

# 每轮最大迁移次数 (fix14: 新增配置项，原硬编码20)
MAX_MIGRATIONS_PER_CYCLE=20

# ── 热管理 (v88: 合理默认值, 全部为配置项可修改) ──
THERMAL_ENABLED=1
THERMAL_LIMIT_CPU=120
THERMAL_LIMIT_SKIN=120
THERMAL_LIMIT_BATTERY=120
# 旧键 THERMAL_EMERGENCY 已删除。EMERGENCY 阈值由新键
# THERMAL_EMERGENCY_THRESHOLD (见下方温控墙三档) 决定；旧键仅在新键=0 时回退生效。

# ── 算力优先分配 + 智能绑核 ──
# 关键线程(UI/RENDER/GAME) placement 成功后通过 sched_setattr() 设 RT + uclamp。
# PRIORITY_BOOST_LEVEL: 1=轻度(RR,prio=1) 2=中度(FIFO,prio=2) 3=激进(FIFO,prio=3)
PRIORITY_BOOST_ENABLED=1
PRIORITY_BOOST_LEVEL=1
# 智能绑核：核心适合度评分权重（核心类型/负载/温度/缓存亲和性），求和≈1.0
SMART_PLACEMENT_ENABLED=1
CORE_AFFINITY_WEIGHT=0.3
LOAD_BALANCE_WEIGHT=0.4
TEMPERATURE_WEIGHT=0.3

# ── 帧感知 (V3) ──
FRAME_AWARE=1
TARGET_FRAME_TIME=16667
FRAME_CRITICAL_THRESHOLD=12000
JANK_THRESHOLD_PERCENT=3.0

# 图层数临界阈值 (fix14: 新增配置项，原硬编码150)
LAYER_CRITICAL_THRESHOLD=150

# ── 学习系统 (V2) ──
LEARNING_ENABLED=1
HISTORY_WEIGHT=30
LEARNING_DECAY=95
HISTORY_MIN_SAMPLES=5
# ── fix21: ML在线学习闭环系统 (Per-Pool Logistic回归 + SGD) ──
# 总开关: 1=启用, 0=禁用(完全回退到fix20启发式)
# ML_ENABLED 为 ML_LEARNING_ENABLED 的友好别名(默认即 true)。
# 显式写出来便于诊断脚本/WebUI 确认 ML 处于启用状态。
ML_ENABLED=1
ML_LEARNING_ENABLED=1
# 模型最大权重系数 (0-1, 模型分数在决策融合中的最大占比)
ML_MAX_ALPHA=0.3
# 初始学习率 (SGD步长, 典型值0.001-0.1)
ML_INITIAL_LR=0.01
# 学习率衰减系数 (每轮乘以此值, 0.999=缓慢衰减)
ML_DECAY=0.999
# 模型保存间隔 (秒)
ML_SAVE_INTERVAL=30
# 权重钳制范围 (防止梯度爆炸, ±此值)
ML_WEIGHT_CLAMP=10.0
# ── v66: 混合学习 (实验性, 默认关闭) ──
# 延迟监督学习(80%) + 实时微调(20%)
# 0=纯延迟监督学习(默认), 1=启用混合学习
ML_HYBRID_ENABLED=0

# ── v66: 电池老化保护 ──
# 老化电池(循环>500或健康度<80%)时对BIG核扣50分、MID核扣20分，降低大核压力
# 1=启用(默认), 0=关闭(关闭后getBatteryAgePenalty恒返回0)
# 终审对齐红线"新功能默认开"：出厂默认与代码 Config 默认 (batteryAgingProtection=true) 一致，
# 由 v88 的 0 改为 1。该功能仅对已老化电池降大核压力，属电池安全保护，默认开不损伤正常电池。
BATTERY_AGING_PROTECTION=1

# ── v66: ML冷启动保护 ──
# ML模型在每个pool的样本数达到阈值前不参与调度决策，避免未训练充分的模型导致次优放置
# 1=启用(默认), 0=关闭(关闭后ML立即参与调度，无论样本数多少)
ML_COLD_START_PROTECTION=1
# 每个pool达到此样本数后，ML才开始参与调度决策(默认2000)
ML_MIN_SAMPLES=2000

# ── v66-fix: 内置HTTP服务器 ──
# 内置 HTTP 服务器开关（绑定 127.0.0.1，本地回环仅本机可访问）
# 1=启用, 0=禁用
ENABLE_HTTP_SERVER=1
FEDERATED_ENABLED=1
ML_FRAME_TIME_OUTCOME=1
ML_FRAME_TIME_WEIGHT=0.5

# ── v4.2 (Batch B, Step0 预占): ML 鲁棒裁剪 / 漂移再学习 / ε-贪心探索 ──
# 默认全 off（0 / 0 / 0.0），与 v4.1.1 逐位一致（纯长期权重 / 不探索）。
# 当前无代码消费这三个键；需要灰度时取消注释并按需调值。
# ML_OUTCOME_MAD_FILTER: 0=关(v4.1.1), 1=开 MAD k=3 outcome 鲁棒裁剪
# ML_OUTCOME_MAD_FILTER=0
# ML_DRIFT_RELEARN: 0=关, 1=开分布漂移再学习
# ML_DRIFT_RELEARN=0
# ML_EPSILON_GREEDY: ε-贪心反事实探索概率，范围 0.0-0.05，0.0=关不探索
# ML_EPSILON_GREEDY=0.0

# ── v73: eBPF事件驱动架构 ──
# 用eBPF tracepoint实时监听线程创建/销毁/CPU调度/应用启动，替代轮询
# 支持多种加载方式自动检测: embedded_syscall > syscall_precompiled > bpftool_precompiled > fallback
# EBPF_ENABLED=1启用eBPF, 0=纯轮询
EBPF_ENABLED=1
# perf ring buffer页数 (32→128页=512KB per CPU, 4MB/8-core)
# 之前64页(256KB)在热节流时poll线程被饿死导致ring_lost暴增(205次/秒)
EBPF_RING_PAGES=128
# eBPF失败时是否降级到轮询 (1=是, 0=否)
EBPF_POLL_FALLBACK=1

# ── ADRC (Active Disturbance Rejection Control) ──
# 自抗扰控制器: TD跟踪微分器 + ESO扩张状态观测器 + NLSEF非线性反馈
# ADRC提供前馈预测信号, 与ML反馈信号融合决策
# 1=启用, 0=禁用
ADRC_ENABLED=1
# 采样周期 (秒, 默认0.05=50ms, 与决策周期一致)
ADRC_H=0.05
# 跟踪速度因子 (默认50, 越大跟踪越快但越激进)
ADRC_R=50
# ESO带宽参数 (beta01/beta02/beta03)
# 二阶ESO: z1帧时间估计, z2变化率估计, z3总扰动估计
ADRC_BETA01=100
ADRC_BETA02=300
ADRC_BETA03=1000
# NLSEF反馈增益 (beta1/beta2)
ADRC_BETA1=10
ADRC_BETA2=0.5
# 非线性幂次 (alpha1/alpha2)
ADRC_ALPHA1=0.75
ADRC_ALPHA2=1.25
# 线性区间阈值 (delta, 零点附近避免振荡)
ADRC_DELTA=0.01
# 控制增益 (b0)
ADRC_B0=1.0
# 输出信号阈值
ADRC_URGENCY_THRESHOLD=0.5
ADRC_RISK_THRESHOLD=0.6
ADRC_CLAMP_FRAME_RATIO=0.7
# ADRC+ML融合权重 (基础权重, 根据置信度动态调整)
ADRC_WEIGHT_BASE=0.4
ADRC_ML_WEIGHT_BASE=0.6

# ── 线程发现 ──
THREAD_SCAN_INTERVAL=5
MAX_TRACKED_THREADS=512
IGNORE_SYSTEM_THREADS=1
# v68 P1: 包名白名单 (逗号分隔, 空=允许所有包)
# 仅扫描/调度白名单内包的线程，留空则不限制
PACKAGE_WHITELIST=

# v71: 用户手动标记的游戏包名列表（方案C，逗号分隔，空=不使用手动列表）
# 当方案A（detectGameScene）无法识别时，此列表中的包名的UI/渲染线程会被标记为is_game
GAME_PACKAGES=com.tencent.tmgp.sgame,com.miHoYo.GenshinImpact,com.tencent.tmgp.pubgmhd

# ── 安全防护 ──
# P23: secure-by-default. Enables HMAC-SHA256 authentication on the HTTP /control
# surface (localhost-bound but reachable by other local processes). WebUI auto-fetches
# the HMAC key (via daemon token) and signs each command with .ts=<unix_ts>.sig=<hmac>,
# timestamp bound into the signature with a +/-300s replay window (P24).
# Downgrade to 0 ONLY for trusted offline debugging; the root-only control pipe
# /dev/aatpe/control (0600) remains usable by aatpe-cli/KSU exec without HMAC.
HMAC_REQUIRED=1
WATCHDOG_ENABLED=1
WATCHDOG_INTERVAL=3
SAFETY_MIGRATION_LIMIT=120
SAFETY_LATENCY_LIMIT=20000
# 安全负载阈值 (归一化loadavg百分比, 仅作为辅助backstop, v69后主判断改为CPU使用率)
# 全局值改回95, 与各profile一致 (此前改thermal120时sed误伤为120)
SAFETY_LOAD_LIMIT=95
# v69: CPU使用率阈值 (百分比, 主判断依据). 超过此值触发DEGRADED降频模式.
# 替代之前的loadavg归一化 — loadavg包含D状态进程导致Android上虚高.
# 范围: 10-100, 默认85
CPU_USAGE_LIMIT=85

# Daemon内存告警阈值 (KB) (fix14: 新增配置项，原硬编码65536)
DAEMON_MEMORY_WARN_KB=65536

# ── 调试 ──
LOG_LEVEL=2
# 0=ERROR, 1=WARN, 2=INFO, 3=DEBUG, 4=TRACE
LOG_DECISIONS=1
LOG_THERMAL=1
LOG_FRAME=1

# ── 场景自动切换 ──
# fix40: AUTO_PROFILE=1/0 是用户偏好设置。
# 如果检测到 AATPE-Helper APK (com.aatpe.helper) 已安装，
# 模块会强制关闭 auto_profile，由 APK 控制场景切换。
# 未安装 APK 时，使用此处的配置值（模块控制场景切换）。
AUTO_PROFILE=1
# v72: 用户手动锁定的性能配置 (balanced/gaming/battery/thermal)
# 当 AUTO_PROFILE=0 时生效，重启后保持用户选择
CURRENT_PROFILE=balanced
GAME_DETECTION=1
BATTERY_SAVER_THRESHOLD=20
THERMAL_PROFILE_THRESHOLD=80

# ── 温控墙三档（WARNING < CRITICAL < EMERGENCY）──────────────────
# 单位：°C。thermal.cpp 已自动把毫摄氏度(/1000)、分摄氏度(/10)读数归一到 °C。
# 三档必须严格单调递增；validateConfig() 会校验 WARNING < CRITICAL < EMERGENCY，
# 不满足时输出警告并自动拉平（旧值 WARNING=84/CRITICAL=83 语义颠倒，已修正）：
#   WARNING   = 80：温度到此自动切 thermal 保护 profile
#   CRITICAL  = 90：CPU 温控压力墙 / headroom 基准
#   EMERGENCY = 120：最高保护墙，默认抬高避免误触发，靠 CRITICAL=90 兜底
# 设为 0 可回退到旧键 THERMAL_PROFILE_THRESHOLD/THERMAL_LIMIT_CPU/THERMAL_EMERGENCY。
THERMAL_WARNING_THRESHOLD=80
THERMAL_CRITICAL_THRESHOLD=90
THERMAL_EMERGENCY_THRESHOLD=120

# ── 刷新率检测模式 (fix15) ──
# peak   : 取设备最高刷新率（默认，游戏/锁定高刷推荐）
# current: 取当前实际刷新率（日常/省电/跟随系统推荐）
# auto   : 游戏前台→peak，非游戏前台→current（智能混合）
REFRESH_RATE_MODE=current

# ── 核心池配置 (留空=自动检测) ──
# CONF-03: 支持逗号分隔(0,1,2,3)和范围格式(0-3)
# LITTLE_POOL= (留空=自动检测 via cpu_capacity)
# MID_POOL= (留空=自动检测 via cpu_capacity)
# BIG_POOL= (留空=自动检测 via cpu_capacity)
# ── Watchdog 配置 (fix18 新增) ──
WATCHDOG_MAX_RESTARTS=5
WATCHDOG_RESTART_WINDOW=60

# fix98: Per-App configuration override (example)
# Format: [app:package_name]
# Supported keys: profile, decision_interval, max_fps
# [app:com.miHoYo.GenshinImpact]
# profile = gaming
# decision_interval = 50
# max_fps = 60
#
# [app:com.tencent.tmgp.pubgmhd]
# profile = gaming
# decision_interval = 50

# ROUND-014 P3: tunable boost level calibration (G12 report).
# uclamp.min as percent of 1024 (per-task sched_setattr path).
UCLAMP_PASSIVE_PCT=25
UCLAMP_CRITICAL_MIN_PCT=80
UCLAMP_CRITICAL_MAX_PCT=100
UCLAMP_ASSIST_MIN_PCT=70
UCLAMP_SF_PCT=20
# Input boost hold duration by refresh rate (ms).
INPUT_BOOST_MS_60=80
INPUT_BOOST_MS_120=50
INPUT_BOOST_MS_144=40
# schedtune.boost levels (D1100 fallback path).
# CRITICAL is written only at GPU-pegged/touch key events (not resident).
SCHEDTUNE_CRITICAL_BOOST=60
# Reserved v4.2: no passive resident schedtune path in current cpuset arch.
# SCHEDTUNE_PASSIVE_BOOST=20
# v4.2 (Batch A, Step0 预占): promote 时叠加的辅助 boost 档。范围 0-100，默认 50。
# 默认即与 v4.1.1 行为一致（当前无代码消费此字段）；需要时取消注释并按需调值。
# SCHEDTUNE_ASSIST_BOOST=50

# ── C1/C3 exploration switches (DEFAULT OFF, v4.4.0 behavior preserved) ──
# These are experimental deep-dive prototypes from the W3/W5 exploration.
# When off (default), the daemon behaves exactly as v4.4.2.
# Valid values: 0/1/true/false/yes/no/on/off (case-insensitive).
# PREBOOST_ENABLED=false  — C1: predictive pre-boost (arm before jank actually happens)
# THERMAL_SMOOTH_ENABLED=false — C3: continuous headroom-based smooth derating
# SCENEINFER_ENABLED=false — W5: 5-scene inference engine (MENU/LOADING/COMBAT/TEAMFIGHT/BACKGROUND)
# C2_ENVELOPE_ENABLED=false — W5: load↔combat asymmetric boost envelope (parasitic on C1)
# C4_FREEZER_ENABLED=true — v4.4.4: freeze the game's cgroup v2 while in background.
#   Default ON since v6.0.0 round4c (was OFF in v4.4.x). Only freezes the game's
#   OWN uid_<uid> cgroup (never system cgroups); never freezes the foreground/
#   top-app or an app playing audio/recording (music/voice/IM whitelist);
#   symmetrically unfreezes on return to foreground; any failure degrades to the
#   legacy background behaviour. Requires a cgroup v2 hierarchy with the freezer
#   controller. Set =false to restore the legacy no-freeze behaviour.
PREBOOST_ENABLED=false
THERMAL_SMOOTH_ENABLED=false
SCENEINFER_ENABLED=false
C2_ENVELOPE_ENABLED=false
C4_FREEZER_ENABLED=true
